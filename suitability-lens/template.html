<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Suitability Lens</title>
<style>
:root { --bg:#ffffff; --fg:#1a1a1a; --muted:#5f5f5f; --line:#e4e4e1;
        --market:#c86b2b; --goal:#1a6a4f; --warn:#b3402f; --card:#f7f7f5;
        --track:#e0e0dc; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --fg:#ececec; --muted:#a2a2a2; --line:#2c2c2c;
          --market:#e0894f; --goal:#5bbf98; --warn:#e0705c; --card:#1d1d1d;
          --track:#333330; } }
/* Explicit viewer toggle wins over the OS preference in both directions. */
:root[data-theme="light"] { --bg:#ffffff; --fg:#1a1a1a; --muted:#5f5f5f;
  --line:#e4e4e1; --market:#c86b2b; --goal:#1a6a4f; --warn:#b3402f;
  --card:#f7f7f5; --track:#e0e0dc; }
:root[data-theme="dark"] { --bg:#141414; --fg:#ececec; --muted:#a2a2a2;
  --line:#2c2c2c; --market:#e0894f; --goal:#5bbf98; --warn:#e0705c;
  --card:#1d1d1d; --track:#333330; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden; }
.wrap { max-width:720px; margin:0 auto; padding:22px 16px 72px; }
h1 { font-size:1.55rem; margin:0 0 6px; letter-spacing:-0.01em; }
.sub { color:var(--muted); margin:0 0 22px; font-size:0.95rem; }
.tabs { display:flex; gap:8px; margin:0 0 18px; }
.tab { flex:1; padding:11px 6px; border:1px solid var(--line); border-radius:11px;
  background:var(--card); color:var(--fg); cursor:pointer; font-size:0.95rem;
  font-weight:500; transition:border-color .15s,color .15s; }
.tab.active { border-color:var(--goal); color:var(--goal); font-weight:700; }
.who { margin:2px 0 4px; }
.meta { color:var(--muted); font-size:0.9rem; margin:0 0 4px; }
.lenses { display:flex; gap:12px; margin:18px 0 6px; }
.lens { flex:1; min-width:0; border:1px solid var(--line); border-radius:13px;
  padding:14px 14px 16px; background:var(--card); }
.lens h3 { margin:0 0 6px; font-size:0.72rem; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--muted); min-height:2.2em; }
.big { font-size:1.9rem; font-weight:750; line-height:1; }
.market .big { color:var(--market); } .goal .big { color:var(--goal); }
.goal.neg .big { color:var(--warn); }
.rows { margin-top:10px; }
.row { display:flex; justify-content:space-between; gap:10px; font-size:0.82rem;
  color:var(--muted); padding:2px 0; }
.row span:last-child { white-space:nowrap; font-variant-numeric:tabular-nums;
  color:var(--fg); }
svg { width:100%; height:auto; display:block; margin:6px 0 2px; }
.flag { border-left:3px solid var(--warn); padding:9px 13px; margin:14px 0;
  background:var(--card); border-radius:0 9px 9px 0; font-size:0.92rem; }
.slabels { display:flex; justify-content:space-between; font-size:0.8rem;
  color:var(--muted); margin:18px 0 2px; }
input[type=range] { width:100%; accent-color:var(--goal); height:26px; }
.cond { border:1px dashed var(--line); border-radius:11px; padding:12px 14px;
  margin:16px 0; font-size:0.9rem; }
.badge { font-weight:700; font-size:0.72rem; padding:1px 7px; border-radius:20px;
  border:1px solid currentColor; margin-left:4px; }
.badge.elevated { color:var(--warn); } .badge.normal { color:var(--goal); }
.decision { margin:18px 0 0; padding:12px 14px; border-radius:11px;
  background:var(--card); border:1px solid var(--line); }
.decision b { color:var(--goal); }
.note { white-space:pre-wrap; border:1px solid var(--line); border-radius:13px;
  padding:16px 17px; margin:16px 0 0; background:var(--card); font-size:0.95rem; }
.disc { color:var(--muted); font-size:0.78rem; margin-top:34px;
  border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Suitability Lens</h1>
  <p class="sub">A risk label ranks how much a portfolio moves. It does not
  describe the risk a client actually faces. Pick a client and watch the two pull
  apart. Data as of __AS_OF__, in US dollars. Illustrative, and not investment
  advice.</p>
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
  <p class="disc" id="disc"></p>
</div>

<script id="cases-data" type="application/json">__CASES_JSON__</script>
<script>
const CASES = JSON.parse(document.getElementById('cases-data').textContent);
const panel = document.getElementById('panel');
const tabsEl = document.getElementById('tabs');
let current = 0;
const step = {};

function secondLensTitle(metric){
  if (metric === 'survival') return 'Chance the money lasts 30 years';
  if (metric === 'accumulation') return 'Chance the deposit goal is met';
  return 'Hidden risk: worst fall since 2021';
}

function bar(y, label, frac, colorVar){
  const w = 320;
  return `<text x="0" y="${y}" fill="var(--muted)" font-size="11">${label}</text>
    <rect x="0" y="${y+6}" width="${w}" height="10" rx="5" fill="var(--track)"/>
    <rect x="0" y="${y+6}" width="${Math.max(2,(w*frac)).toFixed(0)}" height="10" rx="5" fill="${colorVar}"/>`;
}

function gauge(marketVol, second, metric){
  const mv = Math.min(marketVol, 25) / 25;
  let goalFrac, goalColor;
  if (metric === 'concentration'){ goalFrac = Math.min(Math.abs(second), 50)/50; goalColor='var(--warn)'; }
  else { goalFrac = second/100; goalColor='var(--goal)'; }
  return `<svg viewBox="0 0 320 78" role="img" aria-label="risk gauge">
    ${bar(10, 'Market risk (volatility, 0 to 25%)', mv, 'var(--market)')}
    ${bar(48, secondLensTitle(metric), goalFrac, goalColor)}
  </svg>`;
}

function condBlock(c){
  const cond = c.conditions;
  if (c.key === 'priya'){
    return `<div class="cond"><b>Current conditions</b>
      <span class="badge ${cond.status}">${cond.status.toUpperCase()}</span><br>
      Over the last year the cap-weighted market (SPY) beat the equal-weighted
      version (RSP) by ${cond.spread_pct.toFixed(1)} points. A small gap means the
      market is not unusually concentrated right now, so this is not a warning
      about a bubble. Her risk is the position she already holds. As of ${cond.as_of}.</div>`;
  }
  const sign = cond.value >= 0 ? '+' : '';
  return `<div class="cond"><b>Current conditions</b>
    <span class="badge ${cond.status}">${cond.status.toUpperCase()}</span><br>
    The rolling stock-bond correlation is ${sign}${cond.value.toFixed(2)}.
    When it is positive, the bond cushion this label leans on is compromised
    today, not just in 2022. As of ${cond.as_of}.</div>`;
}

function draw(){
  const c = CASES.clients[current];
  const i = step[c.key];
  const mk = c.market[i];
  const second = c.goal_values[i];
  const isNeg = c.goal_metric === 'concentration';
  const secondDisplay = isNeg ? `${second.toFixed(0)}%` : `${second.toFixed(0)}%`;
  panel.innerHTML = `
    <p class="who"><strong>${c.name}, ${c.age}.</strong> ${c.story}</p>
    <p class="meta"><strong>Goal:</strong> ${c.goal}</p>
    <p class="meta"><strong>Risk label:</strong> ${c.label}, unchanged across every setting below.</p>
    <div class="lenses">
      <div class="lens market">
        <h3>Market risk (what the label ranks)</h3>
        <div class="big">${mk.vol_pct.toFixed(1)}%</div>
        <div class="rows">
          <div class="row"><span>Worst fall, 23 years</span><span>${mk.max_drawdown_pct.toFixed(0)}%</span></div>
          <div class="row"><span>Worst fall since 2021</span><span>${mk.recent_dd_pct.toFixed(0)}%</span></div>
        </div>
      </div>
      <div class="lens goal ${isNeg?'neg':''}">
        <h3>${secondLensTitle(c.goal_metric)} (what it misses)</h3>
        <div class="big">${secondDisplay}</div>
      </div>
    </div>
    ${gauge(mk.vol_pct, second, c.goal_metric)}
    <div class="flag"><strong>${c.drift}.</strong> Move the slider. The two numbers
      pull apart, and the risk label above never changes.</div>
    <div class="slabels"><span>${c.axis.label_lo}</span><span>${c.axis.label_hi}</span></div>
    <input type="range" min="0" max="${c.axis.steps.length-1}" value="${i}" id="slider"
      aria-label="allocation">
    ${condBlock(c)}
    <div class="decision"><b>Discretionary call:</b> ${c.decision}</div>
    <div class="note">${c.note}</div>`;
  document.getElementById('slider').addEventListener('input', e => {
    step[c.key] = +e.target.value; draw();
  });
}

CASES.clients.forEach((c, idx) => {
  step[c.key] = c.axis.base_index;
  const b = document.createElement('button');
  b.className = 'tab' + (idx === 0 ? ' active' : '');
  b.textContent = c.name;
  b.onclick = () => {
    current = idx;
    [...tabsEl.children].forEach((t, j) => t.classList.toggle('active', j === idx));
    draw();
  };
  tabsEl.appendChild(b);
});
document.getElementById('disc').textContent =
  'Built from free Yahoo Finance total-return data for simplified index proxies ' +
  '(SPY, EFA, EEM, AGG, RSP, SOXX), priced in US dollars. Volatility and drawdown ' +
  'come from about 23 years of history. Survival and goal probabilities are ' +
  'block-bootstrap simulation output and depend on their assumptions, stated in ' +
  'the full write-up. Risk bands and labels are illustrative, in the style of the ' +
  'industry rather than any firm. Nothing here is investment advice.';
draw();
</script>
</body>
</html>
